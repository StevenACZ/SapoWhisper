pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.swift'
      run: scripts/swift_format_changed.sh format {staged_files}
      stage_fixed: true

    lint:
      glob: '*.swift'
      run: scripts/swift_format_changed.sh lint {staged_files}
      fail_text: |
        Swift format/lint failed. Run:
          make format
          make lint

    secrets:
      run: scripts/secrets_scan.sh staged
      fail_text: |
        Potential secret detected in staged changes. Review the gitleaks
        report above; never commit API keys or credentials.

    audio-allowlist:
      run: bash scripts/verify_public_audio_allowlist.sh
      fail_text: |
        Public audio allowlist failed. Tracked audio must match the pinned
        hashes; never commit swapped or private recordings.
