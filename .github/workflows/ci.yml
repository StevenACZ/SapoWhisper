name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install gitleaks
        run: brew install gitleaks

      - name: Install lefthook (optional tooling parity)
        run: brew install lefthook

      - name: Run ci-check
        run: make ci-check
