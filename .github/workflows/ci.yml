name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-check:
    name: Lint · build · test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The runner lacks both tools: gitleaks for the secret scan, and a
      # swift-format new enough to decode the .swift-format config (Xcode 16.4
      # ships 6.1, the config targets 6.3+). Install matching ones via Homebrew.
      - name: Install tools (swift-format, gitleaks)
        run: brew install swift-format gitleaks

      - name: Tool versions
        run: |
          xcodebuild -version
          "$(brew --prefix)/bin/swift-format" --version

      # No Signing.xcconfig on the runner, so SigningDefaults.xcconfig falls back
      # to ad-hoc signing ("-") and the Debug build needs no developer identity.
      - name: Lint (swift-format, strict)
        run: make lint-all SWIFT_FORMAT="$(brew --prefix)/bin/swift-format"

      - name: Secrets scan
        run: make secrets-scan

      - name: Build (Debug, arm64)
        run: make build

      - name: Unit tests
        run: make test
